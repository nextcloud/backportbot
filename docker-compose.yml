services:
  app:
    image: ghcr.io/nextcloud/backportbot:latest
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      APP_ID: 12345
      WEBHOOK_SECRET: 123456789abcdefghijklmnop
      PRIVATE_KEY_PATH: /private-key.pem

    volumes:
      - ./private-key.pem:/private-key.pem:ro
      # Cached clones, so each backport does not clone again
      - cache:/app/cache
      - work:/app/work

volumes:
  cache:
  work:
